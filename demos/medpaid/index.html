<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayOpts - Phone and In Person Cart</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Style for Sticky Header */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #f8f9fa;
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Style the dropdown list */
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            /*max-height: 200px;*/
            overflow-y: auto;
            border: 1px solid #ddd;
            border-top: none;
            z-index: 1000;
        }
        .search-dropdown-item {
            padding: 10px;
            cursor: pointer;
            background-color: #fff  ;
        }
        .search-dropdown-item:hover {
            background-color: #f8f9fa;
        }

        /* Footer styling */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f8f9fa;
        }

        /* Full-screen overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Semi-transparent black */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
        }

        /* Centered text */
        .overlay-content {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .quantity-input {
            min-width: 40px !important;
        }
    </style>
</head>
<body>
<!-- Overlay -->
<div id="overlay" class="overlay d-none">
    <div class="overlay-content text-center">
        Processing <i class="fa-solid fa-circle-notch fa-spin"></i>
        <br>
        <smallxx class="small"><button class="btn btn-sm btn-danger" onclick="endPayment()">STOP <i class="fa-solid fa-hand"></i></button></smallxx>
    </div>
</div>

<!-- Sticky Header Section -->
<header class="sticky-header text-center">
    <h3 class="text-center">PayOpts Phone & Offsite</h3>
    <div class="container">
        <div class="row">
            <div class="col-12 d-flex justify-content-center">
                <div id="prod-list" class="position-relative core-pocket" data-core-templates="prod-search" style="width: 300px;"></div>
            </div>
        </div>
    </div>
</header>

<!-- Offers -->
<div id="promotion-list" class="container mt-3 core-pocket" data-core-templates="ux-promotions"></div>

<!-- Cart -->
<div id="cart-list" class="container core-pocket" data-core-templates="ux-cart"></div>

<!-- Discounts -->
<div id="discount-list" class="container core-pocket" data-core-templates="ux-discounts"></div>

<!-- Spacer -->
<div class="mb-5">&nbsp;</div>
<div class="mb-5">&nbsp;</div>

<!-- Footer Section -->
<footer class="text-center p-3">
    <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Payment Options</button>
    <ul class="dropdown-menu bg-light">
        <li class="text-center"><span class="dropdown-item">Pay by Text or Email</span></li>
        <li><hr class="dropdown-divider"></li>
        <li>
            <div class="col p-1">
                <div class="input-group input-group-sm core-pocket" data-core-templates="input-accounts"></div>
            </div>
        </li>
        <li>
            <div class="col p-1">
                <div class="input-group input-group-sm">
                    <input id="payopts-text-value" title="SMS Number" type="text" class="form-control h--account-phone" placeholder="SMS Number">
                    <button class="btn btn-success" type="button" id="payopts-text-action">Send <i class="fa-solid fa-fw fa-mobile"></i></button>
                </div>
            </div>
        </li>
        <li>
            <div class="col p-1">
                <div class="input-group input-group-sm">
                    <input id="payopts-email-value" title="Email Address" type="text" class="form-control h--account-email" placeholder="Email">
                    <button class="btn btn-success" type="button" id="payopts-email-action">Send <i class="fa-solid fa-fw fa-at"></i></button>
                </div>
            </div>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li class="">
            <div class="col p-1">
                <div class="input-group input-group-sm">
                    <input id="cart-discount-value" title="Discount Code" type="text" class="form-control h--discount-name" placeholder="Discount Code">
                    <button class="btn btn-outline-secondary" type="button" id="cart-discount-action" onclick="discountLookup(this.parentElement.querySelector('input').value)">Add <i class="fa-solid fa-receipt"></i></button>
                </div>
            </div>
        </li>
        <li class="">
            <div class="col p-1">
                <div class="input-group input-group-sm">
                    <input id="cart-zipcode-value" title="Tax Zipcode" type="text" class="form-control h-taxes-zipcode" placeholder="Zipcode">
                    <button class="btn btn-outline-secondary" type="button" id="cart-zipcode-action" onclick="getTaxInfo(this.parentElement.querySelector('input').value)">Set Tax <i class="fa-solid fa-percent"></i></button>
                </div>
            </div>
        </li>
        <li>
            <div class="col p-1">
                <a class="btn btn-sm btn-outline-danger" href="#" onclick="removeItemsFromCart(core.cr.getData('cart'))"><i class="fa-solid fa-arrows-rotate"></i> Reset Cart</a>
                <a id="payopts-popup" class="d-none btn btn-sm btn-outline-secondary" target="#modal-body" onclick="iframePayment()" data-core-templates="payment-iframe"><i class="fa-solid fa-credit-card"></i> Payment Popup</a>
                <a id="shopify-popup" class="btn btn-sm btn-outline-secondary" onclick="createCheckout()" ><i class="fa-brands fa-shopify"></i> Checkout</a>
            </div>
        </li>
    </ul>
    <br>
    <span class="text-secondary small mb-0">payopts.com &copy; <span class="h-hit-ts f-date" data-f-clue="YYYY"></span></span>
</footer>

<div id="payopts-modal" class="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div id="modal-body" class="modal-body core-pocket" data-core-templates="LOADING"></div>
            <div class="modal-footer d-none">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<section id="cr-data" style="display:none;">
    <template name="input-accounts">
        <select id="payopts-account-value" onchange="if(this.value) {core.cr.setData('account',setClosestClone('account',this.options[this.selectedIndex]));}else{core.cr.delData('account')} refreshCart();" title="Account" class="form-control">
            <option value="">Choose Account</option>
            <option class="core-clone" data-core-data="accounts" data-core-source="https://dummyjson.com/users?limit=20&skip=10&select=firstName,lastName,username,address,ssn,ein,email,phone" value="{{rec:username}}">{{rec:lastName}}, {{rec:firstName}} {{rec:ein}}</option>
        </select>
    </template>
    <template name="prod-search">
        <div class="input-group">
            <input autocomplete="off" type="text" class="form-control" id="searchInput" placeholder="Product Search..." onkeyup="filterOptions()">
        </div>
        <div class="search-dropdown d-none" id="dropdownOptions">
            <div class="core-clone search-dropdown-item" data-core-data="prods" data-core-source="https://dummyjson.com/products?limit=30">
                <div class="row m-0 small">
                    <div class="col p-0 m-0">
                        {{rec:thumbnail:imgsrc:class="w-50"}}
                    </div>
                    <div class="col p-0 m-0 text-truncate">
                        {{rec:title}}
                    </div>
                    <div class="col p-0 m-0">
                        {{rec:sku:upper}}
                    </div>
                    <div class="col p-0 m-0">
                        <div class="input-group-sm">
                            <a href="#" class="btn btn-secondary p-1" target="#modal-body" onclick="modal.show(); setClosestClone('prod',this);" data-core-templates="prod-detail"><i class="fa-solid fa-fw fa-ellipsis-vertical fa-xs"></i></a>
                            <button type="button" class="btn btn-success p-1" onclick="itemAddCleanup(setClosestClone('item',this))"><i class="fa-solid fa-fw fa-plus fa-xs"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template name="prod-detail">
        <div class="core-clone" data-core-data="prod">
            <div class="row">
                <div class="col">
                    <h3>
                        {{rec:title}}
                    </h3>
                    <small class="text-secondary small">{{rec:sku}}</small>
                    <h2>{{rec:price:money:$}}</h2>
                </div>
                <div class="col">
                    <p class="text-end"><button type="button" class="btn btn-success item-add" onclick="itemAddCleanup(setClosestClone('item',this))"><i class="fa-solid fa-fw fa-plus fa-beat" style="--fa-animation-duration: 2s;"></i> Add to Cart</button></p>
                </div>
            </div>
            {{rec:thumbnail:imgsrc:class="w-100"}}
            <p>{{rec:description}}</p>
            <p>Shipping Info: {{rec:shippingInformation}}</p>
            <p>Warranty: {{rec:warrantyInformation}}</p>
            <p>Return Policy: {{rec:returnPolicy}}</p>
        </div>
    </template>
    <template name="ux-cart">
        <div class="container mt-4">
            <div class="table-responsive">
                <table class="table table-bordered table-hover mt-3">
                    <thead class="table-light">
                    <tr>
                        <th>Item</th>
                        <th>Desc</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="core-clone" data-core-data="cart">
                        <td>
                        {{rec:title}}
                        </td>
                        <td>
                        <div class="row g-2">
                            <div class="col-sm-3">
                            {{rec:thumbnail:imgsrc:class="w-100"}}
                            </div>
                            <div class="col-sm-9">
                            <span class="d-none d-lg-block">{{rec:description:truncate:56}}</span><br>
                            <span class="small text-secondary">{{rec:sku:upper}}</span>
                            </div>
                        </div>
                        </td>
                        <td class="text-end text-nowrap">
                        {{rec:price:money:$}} <br>
                        <a href="#" class="small" onclick="removeItemFromCart(setClosestClone('removed',this))">Remove</a> |
                        <a href="#" class="small" target="#modal-body" onclick="modal.show(); setClosestClone('prod',this);" data-core-templates="prod-detail">View</a>
                        </td>
                        <td>
                        <div class="input-group input-group-sm flex-nowrap">
                            <button class="btn btn-sm btn-outline-secondary" type="button" onclick="decreaseQuantity(this)">-</button>
                            <input type="number" value="{{rec:quantity}}" min="1" class="form-control text-center quantity-input" readonly>
                            <button class="btn btn-outline-secondary" type="button" onclick="increaseQuantity(this)">+</button>
                        </div>
                        </td>
                        <td class="total-price text-end text-nowrap">{{rec:total:money:$}}</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="small">
                        <td colspan="4" class="text-end"><span>Subtotal:</span></td>
                        <td class="text-end"><span class="grand-total h--totals-subtotal f--money" data-f-clue="$"></span></td>
                    </tr>
                    <tr class="small">
                        <td colspan="4" class="text-end"><span>Discount <span class="small">(<span class="h--discount-name"></span>)</span>:</span></td>
                        <td class="text-end"><span class="grand-total h--totals-discount f--money" data-f-clue="$"></span></td>
                    </tr>
                    <tr class="small">
                        <td colspan="4" class="text-end"><span>Taxes <span class="small">(<span class="h--taxes-percentage"></span>%)</span>:</span></td>
                        <td class="text-end"><span class="grand-total h--totals-taxes f--money" data-f-clue="$"></span></td>
                    </tr>
                    <tr>
                        <td colspan="4" class="text-end"><strong>Grand Total:</strong></td>
                        <td class="text-end"><strong class="grand-total h--totals-total f--money" data-f-clue="$"></strong></td>
                    </tr>
                    </tfoot>
                </table>
                </div>

        </div>
    </template>
    <template name="ux-promotions">
        <div class="form-control-sm">
            <button class="btn btn-outline-secondary core-clone" data-core-data="promos" data-core-source="/demos/medpaid/promos.json" onclick="addItemsToCart(setClosestClone('promo',this).prods)">
                #{{aug:count:padleft:2|0}} - {{rec:name}}
            </button>
        </div>
    </template>
    <template name="ux-discounts">
        <div class="form-control-sm">
            <button class="btn btn-link core-clone" title="{{rec:description}}" data-core-data="discounts" data-core-source="/demos/medpaid/discounts.json" onclick="core.cr.setData('discount', setClosestClone('discount',this));refreshCart();">
                {{rec:name}}
            </button>
        </div>
    </template>
    <template name="payment-iframe">
        <div style="width:100%; height: 545px;" id="map">
            <iframe id="payopts-iframe" src="" style="border: 0" width="100%" height="545" frameborder="0"></iframe>
        </div>
    </template>
</section>  

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Sitezip/core.sbs@20250312.0/core.js"></script>

<script src="medpaid.js"></script>

<script>
    // start user defined core functions
    core.ud.init = () => {
        core.cr.setData('hit', {
            ts:core.hf.date(null,'ts'),
            YYYY:core.hf.date(null,'YYYY')
        });

        // set some defaults
        core.cr.setData('totals', {
            discount:0,
            subtotal:0,
            taxable:0,
            taxes:0,
            total:0,
        });

        core.cr.setData('taxes', {
            zipcode:84003,
            decimal:0.075,
            percentage:7.5,
        });

        //ccSetup, not used
        let ccYYYY = [];
        [0,1,2,3,4,5,6].forEach((i)=>{
        ccYYYY.push({'YYYY':+core.cr.getData('hit').YYYY + i});
        })
        let ccMM = [{MM:'January'},{MM:'February'},{MM:'March'},{MM:'April'},{MM:'May'},{MM:'June'},{MM:'July'},{MM:'August'},{MM:'September'},{MM:'October'},{MM:'November'},{MM:'December'}]
        core.cr.setData('ccYYYY', ccYYYY);
        core.cr.setData('ccMM', ccMM);
        core.cr.setData('cart', []);
        core.useDebugger = true;

        // testing
        // const discounts = [];
        // for(const i of new Array(3).fill(1)){
        //     let num = discounts.length + 1;
        //     let discount   = core.cr.getData('coreInternalObjects').discount;
        //     discount.guid  = core.hf.uuid();
        //     discount.ts    = core.hf.date(null, 'TS');
        //     discount.name  = "Super Saver " + (5 * num);
        //     discount.dateStart = core.hf.date();
        //     discount.dateEnd   = core.hf.date(core.hf.date(null,'TS') + (86400 * 2));
        //     discount.description   = "Save " + (5 * num) + "% on everything in the store.";
        //     discount.percentAmount = roundlessToFix(.05 * num);
        //     discounts.push(discount);
        // }

        // core.cr.setData('discounts', discounts);
    }

    core.ud.preflight = (dataRef, dataSrc, type) => {
        let settings = {dataRef, dataSrc, type};
        if(type === 'data'){
            switch(dataRef){
                case 'discounts':
                    settings.dataSrc = '/demos/medpaid/discounts.json';
                    break;
                case 'accounts':
                    settings.dataSrc = '/demos/medpaid/accounts.json';
                    break;
                case 'promos':
                    settings.dataSrc = '/demos/medpaid/promos.json';
                    break;
                case 'cart':
                    break;
                case 'prods':
                    const domain = 'medpaid.myshopify.com';
                    const storefrontAccessToken = '';
                    const endpoint = `https://${domain}/api/2023-10/graphql.json`;
                    settings.dataSrc = endpoint;

                    let cursor = null;
                    const query = `
                        query GetProducts($cursor: String) {
                            products(first: 100, after: $cursor) {
                            pageInfo {
                                hasNextPage
                            }
                            edges {
                                cursor
                                node {
                                id
                                title
                                handle
                                description
                                images(first: 1) {
                                    edges {
                                        node {
                                            src
                                        }
                                    }
                                }
                                variants(first: 1) {
                                    edges {
                                    node {
                                        id
                                        price {
                                            amount
                                            currencyCode
                                        }
                                    }
                                    }
                                }
                                }
                            }
                            }
                        }`;

                    const variables     = {cursor};
                    settings.data       = {query, variables};
                    settings.headers    = {'Content-Type':'application/json','X-Shopify-Storefront-Access-Token': storefrontAccessToken};
                    settings.method     = 'POST';
                    settings.isFormData = false; //needs to be set at body

                    break;
                case 'taxApi':
                    break;
            }
        }else{
            //TODO
        }
        if(core.useDebugger) console.log('ud.preflight',{dataRef, dataSrc, type, settings});
        return settings;
    }

    core.ud.postflight = (dataRef, dataObj, type) => {
        const newDataObj = [];
        if(type === 'data'){
            if(dataRef.startsWith("taxApi") && dataObj.success && dataObj.hasOwnProperty('response')){
                dataObj = dataObj.response;
                core.cr.setData('taxes', {
                    zipcode:dataObj.results[0].geoPostalCode,
                    decimal:dataObj.results[0].taxSales,
                    percentage:toPercentage(dataObj.results[0].taxSales),
                });
                refreshCart();
            }
            switch(dataRef){
                case 'accounts':
                    // for(const account of dataObj.users){
                    //     newDataObj.push({...core.cr.getData('coreInternalObjects').contact,...account,...{guid:core.hf.uuid()}})
                    // }
                    dataObj = newDataObj;
                    break;
                case 'prods':
                    console.log('prods',dataObj);
                    const products = dataObj.data.products.edges;
                    
                    for(const prod of products){
                        let product = prod.node || {};
                        
                        product.thumbnail = product.images.edges[0]?.node.src || '';
                        product.price     = product.variants.edges[0]?.node.price.amount || 'N/A';
                        product.currency  = product.variants.edges[0]?.node.price.currencyCode || '';
                        product.variantId = product.variants.edges[0]?.node.id || '';
                        product.sku       = product.variantId.split('/').pop(); // required for cart functionality

                        newDataObj.push({...core.cr.getData('coreInternalObjects').item,...product,...{guid:core.hf.uuid()}})
                    }
                    dataObj = newDataObj;
                    break;
                case 'promos':
                    // for(const prod of dataObj.products){
                    //     newDataObj.push({...core.cr.getData('coreInternalObjects').item,...prod,...{guid:core.hf.uuid()}})
                    // }
                    // dataObj = [
                    //     {name:"Starter Pak",prods:[newDataObj[0],newDataObj[1],newDataObj[2]]},
                    //     {name:"Monthly Pak",prods:[newDataObj[3],newDataObj[4]]},
                    //     {name:"Seasonal Pak",prods:[newDataObj[5]]},
                    // ];
                    break;
                case 'payoptsreport':
                    if(data.hasOwnProperty('response') && dataObj.response.hasOwnProperty('successTs') && dataObj.response.successTs) {
                        // Payment processed
                        endPayment();
                        alert('Payment successful!');
                    } else {
                        // Request payment report
                        setTimeout(() => {
                            core.be.getData('payoptsreport', core.cr.getData('payoptsreportlink'));
                        },5000);
                    }
                    break;
            }
        }else{
            //TODO
        }
        if(core.useDebugger) console.log('ud.postflight',{dataRef, dataObj, type});
        return dataObj;
    }

    core.ud.postpaint = (dataRef, dataObj, type) => {
        if(type === 'data'){
            switch(dataRef){
                case 'cart':
                    break;
                case 'prods':
                    setTimeout(()=>{
                        document.getElementById('searchInput').addEventListener('focus', function() {
                            this.value = '';
                        });
                    },250)
                    break;
            }
        }else{
            //TODO
        }
        if(core.useDebugger) console.log('ud.postpaint',{dataRef, dataObj, type});
    }

    core.ud.prepaint = () => {}
    // end user defined core functions

    const modal = new bootstrap.Modal(document.getElementById('payopts-modal'), {});

    function setClosestClone(storageName, element) {
        const clone     = element.parentElement.closest('[class*="core-cloned"]') || element;
        const cloneData = core.cr.getData('coreRecord', clone, 0) || {};
        // Store the cart
        core.cr.setData(storageName, [cloneData]);
        return cloneData;
    }

    function getTaxInfo(zipcode) {
        //taxes
        const taxData = core.cr.getData('taxApi' + zipcode)
        if(!taxData){
            core.be.getData('taxApi' + zipcode, 'https://zzzap.io/SecureX/taxRateByUsZip/' + zipcode + '?PublicAuthCd=zCd-7a43641a9f185ec6b8e861e6fd89-acf5&extendResponse=true')
        }else{
            core.cr.setData('taxes', {
                zipcode:taxData.results[0].geoPostalCode,
                decimal:taxData.results[0].taxSales,
                percentage:toPercentage(taxData.results[0].taxSales),
            });
            refreshCart();
        }
    }

    function itemAddCleanup(itemRecord) {
        document.getElementById('searchInput').value = 'Added!';
        setTimeout(() => {
            if(document.getElementById('searchInput').value === 'Added!'){
                document.getElementById('searchInput').value = '';
            }
        },2500)
        document.getElementById('dropdownOptions').classList.add('d-none');
        // Add the item to the cart
        updateCartItem(itemRecord);
    }

    function filterOptions() {
        const input    = document.getElementById("searchInput").value.toUpperCase();
        const dropdown = document.getElementById("dropdownOptions");
        const items    = dropdown.querySelectorAll(".search-dropdown-item");

        // Show the dropdown if input has value
        dropdown.classList.toggle("d-none", !input);

        items.forEach(item => {
            const text = item.textContent || item.innerText;
            item.style.display = text.toUpperCase().includes(input) ? "" : "none";
        });
    }
    
    const removeItemsFromCart = (items) => {
        for(const itemRecord of items){
            removeItemFromCart(itemRecord);
        }
    }

    const removeItemFromCart = (itemRecord) => {
        const cart = core.cr.getData('cart');
        // Check cart for item
        const cartItems = [];
        for (const item of cart) {
            if(item.sku !== itemRecord.sku){
                cartItems.push(item);
            }
        }

        // Store the cart
        core.cr.setData('cart', cartItems);

        // Refresh the cart UX
        refreshCart();
    }

    let runRefreshCart = true;

    const addItemsToCart = (items) => {
        for(const itemRecord of items){
            updateCartItem(itemRecord);
        }
    }

    const updateCartItem = (itemRecord, increase = true) => {
        itemRecord = JSON.parse(JSON.stringify(itemRecord));
        const cart = core.cr.getData('cart');
        // Check cart for item, update
        let itemInCart = false;
        for (const item of cart) {
            if(item.sku === itemRecord.sku){
                itemInCart    = true;
                item.quantity = (item.quantity || 0) + (increase ? 1 : -1);
                item.total    = item.quantity * +item.price;
            }
            if(!item.quantity){
                setTimeout(()=>{
                    removeItemFromCart(item);
                })
            }
        }
        // Add new item, update
        if(!itemInCart){
            itemRecord.quantity = itemRecord.quantity || 1;
            itemRecord.total    = itemRecord.quantity * +itemRecord.price;
            cart.push(itemRecord);
        }

        // Store the cart
        core.cr.setData('cart', cart);

        // Refresh the cart UX
        refreshCart();
    }

    const refreshProds = () => {
        const pocket = document.getElementById('prod-list');
        pocket.classList.remove('core-pocketed');
        pocket.classList.add('core-pocket');
        pocket.innerHTML = "";
    }

    const refreshCart = (pause) => {
        if(!runRefreshCart){
            return;
        } else {
            runRefreshCart = false;
            setTimeout(() => {
                // Close the modal, cleanup
                modal.hide();

                const pocket = document.getElementById('cart-list');
                pocket.classList.remove('core-pocketed');
                pocket.classList.add('core-pocket');
                pocket.innerHTML = "";

                //build the order
                const order = core.cr.getData('coreInternalObjects').order;
                order.guid    = core.hf.uuid();
                order.ts      = core.hf.date(null,'TS');
                order.type    = 'cart';
                order.contact = core.cr.getData('coreInternalObjects').contact || order.contact; //TODO use correct object
                order.email   = order.contact.email || null; //TODO use correct object
                order.name    = ((order.contact.firstName || "") + ' ' + (order.contact.lastName || "")).trim() || null; //TODO use correct object
                order.phone   = order.contact.phone || null; //TODO use correct object
                //order.billing  =  core.cr.getData('coreInternalObjects').contact || order.billing; //TODO use correct object
                //order.shipping =  core.cr.getData('coreInternalObjects').contact || order.shipping; //TODO use correct object
                order.discount   =  core.cr.getData('coreInternalObjects').discount || order.discount;
                order.guidDiscount =  order.discount.guid || null;

                // Total the cart
                const cart = core.cr.getData('cart');
                let cartTotal = 0;
                for (const item of cart) {
                    order.items.push(item); //TODO use correct object
                    cartTotal+= +item.total;
                }

                // Calculate & Store the totals
                const totals    = core.cr.getData('totals');
                totals.subtotal = cartTotal;
                totals.discount = applyDiscount(totals.subtotal);
                totals.taxable  = (totals.discount * -1) + totals.subtotal;
                totals.taxes    = roundlessToFix(totals.taxable * core.cr.getData('taxes').decimal);
                totals.total    = totals.taxable + totals.taxes;
                core.cr.setData('totals',totals);

                //finalize pre-order information
                order.amountDue = totals.total;
                order.subtotal  = totals.subtotal;
                order.taxRate   = core.cr.getData('taxes').decimal;
                order.taxes     = totals.taxes;
                order.total     = totals.total;
                core.cr.setData('order',order);

                core.pk.init();
                // Ready to run after delay
                runRefreshCart = true;
            },(pause || 250))
        }
    }

    function discountLookup(name) {
        const discounts = (core.cr.getData('discounts') || []);
        for(const discount of discounts){
            if(discount.name === name || discount.guid === name){
                core.cr.setData('discount',discount);
                refreshCart();
                break;
            }
        }
    }

    function applyDiscount(subtotal) {
        const discountObj = core.cr.getData('coreInternalObjects').discount;
        let discount = 0;
        if(discountObj){
            if(!discountObj.isActive || core.hf.date(discountObj.dateStart,'ts') > core.hf.date(null,'ts') || core.hf.date(discountObj.dateEnd,'ts') < core.hf.date(null,'ts')){
                alert('The ' + discountObj.type + ' is not active.')
            }else{
                if(discountObj.currencyAmount){
                    discount = subtotal - discountObj.currencyAmount;
                }else if(discountObj.percentAmount){
                    discount = subtotal * discountObj.percentAmount;
                }
            }
        }
        return (discount < 0 ? 0 : roundlessToFix(discount));
    }

    function roundlessToFix(number, place) {
        return String(number * (100 || place)).split('.')[0] / (100 || place);
    }

    function toPercentage(decimal, decimalPlaces = 2) {
        const factor     = Math.pow(10, decimalPlaces);
        const percentage = Math.round((decimal * 100) * factor) / factor;
        return +percentage.toFixed(decimalPlaces);
    }

    function overlayDisplay(show) {
        const overlay = document.getElementById('overlay');
        if(show) {
            overlay.classList.remove('d-none');
        } else {
            overlay.classList.add('d-none');
        }
    }

    function increaseQuantity(button) {
        const input = button.parentElement.querySelector('.quantity-input');
        input.value = parseInt(input.value) + 1;
        const itemRecord = core.cr.getData('coreRecord', input.parentElement.closest('.core-cloned-cart'), 0);
        // const itemRecord = JSON.parse(JSON.stringify(core.cr.getData('coreRecord', input.parentElement.closest('.core-cloned-cart'), 0)));
        // itemRecord.quantity = +input.value;
        updateCartItem(itemRecord);
    }

    function decreaseQuantity(button) {
        const input = button.parentElement.querySelector('.quantity-input');
        if (parseInt(input.value) > 1) {
            input.value = parseInt(input.value) - 1;
        }
        const itemRecord = core.cr.getData('coreRecord', input.parentElement.closest('.core-cloned-cart'), 0);
        // const itemRecord = JSON.parse(JSON.stringify(core.cr.getData('coreRecord', input.parentElement.closest('.core-cloned-cart'), 0)));
        // itemRecord.quantity = +input.value;
        updateCartItem(itemRecord, false);
    }

    document.getElementById('payopts-text-action').addEventListener('click',() => {
        const input = document.getElementById('payopts-text-value');
        const check = core.sv.scrubSimple('check',input.value,['req','num','min-10','max-10','phone','numonly']);
        if(!check.success){
            alert(check.errors.join('\r'));
            input.focus();
        } else {
            input.value = '';
            core.cr.setData('paymentphone', check.value);
            core.cr.setData('paymentaccount', core.hf.uuid());
            core.cr.setData('paymentamount',roundlessToFix(core.cr.getData('totals').total));
            startPayment(paymentPhone);
        }
    })

    document.getElementById('payopts-email-action').addEventListener('click',() => {
        const input = document.getElementById('payopts-email-value');
        const check = core.sv.scrubSimple('check',input.value,['req','email']);
        if(!check.success){
            alert(check.errors.join('\r'));
            input.focus();
        } else {
            input.value = '';
            core.cr.setData('paymentemail', check.value);
            core.cr.setData('paymentaccount', core.hf.uuid());
            core.cr.setData('paymentamount', roundlessToFix(core.cr.getData('totals').total));
            startPayment(paymentEmail);
        }
    })

    const iframePayment = () => {
        core.cr.setData('paymentaccount', core.hf.uuid());
        core.cr.setData('paymentamount', roundlessToFix(core.cr.getData('totals').total));
        startPayment(paymentIframe);
    }

    let paymentEmail  = 'https://tco.zzzap.io/Sequence/29805dd/asJSON?account={{account}}&amount={{amount}}&email={{email}}&PublicAuthCd=zCd-ae40173-bed24f676a88cb060ee8ef303'
    let paymentPhone  = 'https://tco.zzzap.io/Sequence/d7d22e0/asJSON?account={{account}}&amount={{amount}}&phone={{phone}}&PublicAuthCd=zCd-a266-ebe-dcfc8ec6c334d9-bfcf17be15e'
    let paymentIframe = 'https://tco.zzzap.io/Sequence/3a892ac/asJSON?account={{account}}&amount={{amount}}&PublicAuthCd=zCd-214de0c9d1-dbe481-cabf4c6d117b0238'

    const startPayment = (sequenceLink) => {
        if(!sequenceLink){
            alert('Payment link not provided!')
            return;
        }
        if(!+core.cr.getData('paymentamount')){
            alert('Payment amount not provided!')
            return;
        }
        overlayDisplay(true);
        let paymentLink = sequenceLink;
        sequenceLink.match(/[^{\{]+(?=}\})/g).forEach(function (placeholder) {
            // Pull the data
            let val = (core.cr.getData('payment' + placeholder) || prompt("What is the " + placeholder.toUpperCase() + "?",''));
            // Create the actual payment link
            paymentLink = paymentLink.replace("{{" + placeholder + "}}", val);
        })

        if(sequenceLink === paymentIframe){
            overlayDisplay(false);
            modal.show();
            paymentLink = paymentLink.split('/asJSON').join('');
            setTimeout(() => {
                document.getElementById('payopts-iframe').setAttribute('src', paymentLink);
            },500)
        }else{
            core.cr.setData('payoptsreportlink', paymentLink);
            core.be.getData('payoptsreport', core.cr.getData('payoptsreportlink'));
        }

        // Remove the payment data
        core.cr.delData('paymentemail');
        core.cr.delData('paymentphone');
        core.cr.delData('paymentaccount');
    }

    const endPayment = () => {
        modal.hide();
        overlayDisplay(false);

        // Remove the payment data
        core.cr.delData('payoptsreportlink');
        core.cr.delData('paymentemail');
        core.cr.delData('paymentphone');
        core.cr.delData('paymentaccount');
    }

</script>
