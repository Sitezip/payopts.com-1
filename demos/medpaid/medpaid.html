<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopify Products Viewer</title>
  
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    #loadProducts, #createOrderBtn, .buyNowBtn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #loader {
      display: none;
      margin-top: 20px;
      text-align: center;
    }
    #loader .spinner {
      width: 40px;
      height: 40px;
      border: 5px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .product {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      width: 200px;
      display: flex;
      flex-direction: column;
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .product h3 {
      font-size: 1.1em;
      margin: 10px 0 5px;
    }
    .product p {
      flex-grow: 1;
      font-size: 0.9em;
    }
    .product strong {
      color: #0077cc;
    }
  </style>
</head>

<body>
  <h1>MedPaid Product Fetcher <span></span></h1>
  <button id="loadProducts">Load Products</button>

  <button id="createOrderBtn">Buy Product (test)</button>

  <!-- 👇 Loader (hidden by default) -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Loading products...</p>
  </div>

  <div id="products"></div>

  <script src="medpaid.js"></script>
</body>
</html>
