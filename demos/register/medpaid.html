<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopify Products Viewer</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    #products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .product {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      width: 200px;
    }
    .product img {
      width: 100%;
      height: auto;
    }
    .product h3 {
      font-size: 1.1em;
      margin: 10px 0 5px;
    }
  </style>
</head>
<body>

  <h1>Shopify Product Fetcher</h1>
  <button id="loadProducts">Load Products</button>
  <div id="products"></div>

  <script src="medpaid.js"></script>
</body>
</html>
