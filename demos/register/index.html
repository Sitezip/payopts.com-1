<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayOpts - Phone and In Person Cart</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Style for Sticky Header */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #f8f9fa;
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Style the dropdown list */
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            /*max-height: 200px;*/
            overflow-y: auto;
            border: 1px solid #ddd;
            border-top: none;
            z-index: 1000;
        }
        .search-dropdown-item {
            padding: 10px;
            cursor: pointer;
            background-color: #fff  ;
        }
        .search-dropdown-item:hover {
            background-color: #f8f9fa;
        }

        /* Footer styling */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

<!-- Sticky Header Section -->
<header class="sticky-header text-center">
    <div class="container">
        <div class="row">
            <div class="col-12 d-flex justify-content-center">
                <div id="prod-list" class="position-relative core-pocket" data-core-templates="prod-search" style="width: 300px;"></div>
            </div>
        </div>
    </div>
</header>

<div id="cart-list" class="container mt-3 core-pocket mb-5" data-core-templates="ux-cart"></div>

<div class="m-5">&nbsp;</div>

<!-- Footer Section -->
<footer class="text-center p-3">
    <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Payment Options</button>
    <ul class="dropdown-menu">
        <li><a id="payopts-text" class="dropdown-item" href="#">Pay by Text</a></li>
        <li><a id="payopts-email" class="dropdown-item" href="#">Pay by Email</a></li>
        <li><a id="payopts-popup" class="dropdown-item" href="#">Pay on Screen</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
            <div class="m-2">
                <input class="form-control form-control-sm" id="cart-discount" placeholder="Discount Code" type="text">
            </div>
        </li>
        <li>
            <div class="m-2">
                <input class="form-control form-control-sm h-taxes-zipcode" id="cart-zipcode" placeholder="Zipcode" type="text">
            </div>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li><a href="?" class="small ms-2">Reset Cart</a></li>
    </ul>
    <br>
    <span class="text-secondary small mb-0">payopts.com &copy; <span class="h-hit-ts f-date" data-f-clue="YYYY"></span></span>
</footer>

<section id="cr-data" style="display:none;">
    <template name="prod-search">
        <div class="input-group">
            <input autocomplete="off" type="text" class="form-control" id="searchInput" placeholder="Search..." onkeyup="filterOptions()">
        </div>
        <div class="search-dropdown d-none" id="dropdownOptions">
            <div class="core-clone search-dropdown-item" data-core-data="prods" data-core-source="https://dummyjson.com/products?limit=30">
                <div class="row m-0 small">
                    <div class="col p-0 m-0">
                        {{rec:thumbnail:imgsrc:class="w-50"}}
                    </div>
                    <div class="col p-0 m-0 text-truncate">
                        {{rec:title}}
                    </div>
                    <div class="col p-0 m-0">
                        {{rec:sku:upper}}
                    </div>
                    <div class="col p-0 m-0">
                        <button type="button" class="btn btn-sm btn-outline-secondary item-add p-1">Add</button>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template name="ux-cart">
        <div class="container mt-4">
            <h2 class="text-center">PayOpts Add & Pay</h2>
            <table class="table table-bordered table-hover mt-3">
                <thead class="table-light">
                <tr>
                    <th>Item</th>
                    <th>Desc</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                </tr>
                </thead>
                <tbody>
                <tr class="core-clone" data-core-data="cart">
                    <td>{{rec:title}}</td>
                    <td>
                        <div class="row">
                            <div class="col-2">{{rec:thumbnail:imgsrc:class="w-100"}}</div>
                            <div class="col-10"><span class="d-none d-lg-block">{{rec:description}}</span> {{rec:sku:upper}}</div>
                        </div>
                    </td>
                    <td class="text-end">
                        {{rec:price:money:$}} <br>
                        <a href="#" class="item-remove small">Remove</a>
                    </td>
                    <td>
                        <div class="input-group input-group-sm quantity-input-group">
                            <button class="btn btn-sm btn-outline-secondary" type="button" onclick="decreaseQuantity(this)">-</button>
                            <input type="number" value="{{rec:quantity}}" min="1" class="form-control text-center quantity-input" readonly>
                            <button class="btn btn-outline-secondary" type="button" onclick="increaseQuantity(this)">+</button>
                        </div>
                    </td>
                    <td class="total-price text-end">{{rec:total:money:$}}</td>
                </tr>
                </tbody>
                <tfoot>
                <tr class="small">
                    <td colspan="4" class="text-end">
                        <span>Subtotal:</span>
                    </td>
                    <td class="text-end"><span class="grand-total h--totals-subtotal f--money" data-f-clue="$"></span></td>
                </tr>
                <tr class="small">
                    <td colspan="4" class="text-end">
                        <span>Discount:</span>
                    </td>
                    <td class="text-end"><span class="grand-total h--totals-discount f--money" data-f-clue="$"></span></td>
                </tr>
                <tr class="small">
                    <td colspan="4" class="text-end">
                        <span>Taxes <span class="small">(<span class="h--taxes-percentage"></span>%)</span>:</span>
                    </td>
                    <td class="text-end"><span class="grand-total h--totals-taxes f--money" data-f-clue="$"></span></td>
                </tr>
                <tr>
                    <td colspan="4" class="text-end">
                        <strong>Grand Total:</strong>
                    </td>
                    <td class="text-end"><strong class="grand-total h--totals-total f--money" data-f-clue="$"></strong></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </template>
</section>  

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Sitezip/core.sbs@20240815.0/core.js"></script>

<script>
    core.ud.init = () => {
        core.cr.setData('hit', {
            ts:core.hf.date(null,'ts'),
            YYYY:core.hf.date(null,'YYYY')
        });

        core.cr.setData('totals', {
            discount:0,
            subtotal:0,
            taxable:0,
            taxes:0,
            total:0,
        });

        core.cr.setData('taxes', {
            zipcode:84003,
            decimal:0.071,
            percentage:7.1,
        });

        //ccSetup
        let ccYYYY = [];
        [0,1,2,3,4,5,6].forEach((i)=>{
        ccYYYY.push({'YYYY':+core.cr.getData('hit').YYYY + i});
        })
        let ccMM = [{MM:'January'},{MM:'February'},{MM:'March'},{MM:'April'},{MM:'May'},{MM:'June'},{MM:'July'},{MM:'August'},{MM:'September'},{MM:'October'},{MM:'November'},{MM:'December'}]
        core.cr.setData('ccYYYY', ccYYYY);
        core.cr.setData('ccMM', ccMM);
        core.cr.setData('cart', []);
        core.useDebugger = true;
    }

    core.ud.postflight = (dataRef, dataObj, type) => {
        if(type === 'data'){
            switch(dataRef){
                case 'prods':
                    dataObj = dataObj.products;
                    break;
            }
        }else{
            //TODO
        }
        if(core.useDebugger) console.log('ud.postflight',{dataRef, dataObj, type});
        return dataObj;
    }

    core.ud.postpaint = (dataRef, dataObj, type) => {
        if(type === 'data'){
            switch(dataRef){
                case 'cart':
                    document.querySelectorAll('.item-remove').forEach(item => {
                        item.addEventListener('click', function() {
                            // Add the item to the cart
                            const itemRecord = JSON.parse(JSON.stringify(core.cr.getData('coreRecord', this.parentElement.closest('.core-cloned-cart'), 0)));
                            removeItemFromCart(itemRecord)
                        });
                    });
                    break;
                case 'prods':
                    setTimeout(()=>{
                        document.getElementById('searchInput').addEventListener('focus', function() {
                            this.value = '';
                        });
                        // Hide the dropdown when an option is clicked
                        document.querySelectorAll('.item-add').forEach(item => {
                            item.removeEventListener('click', itemAddCleanup);
                            item.addEventListener('click', itemAddCleanup);
                        });
                    },250)
                    break;
            }
        }else{
            //TODO
        }
        if(core.useDebugger) console.log('ud.postpaint',{dataRef, dataObj, type});
    }

    function itemAddCleanup() {
        document.getElementById('searchInput').value = 'Added!';
        document.getElementById('dropdownOptions').classList.add('d-none');
        // Add the item to the cart
        const itemRecord = JSON.parse(JSON.stringify(core.cr.getData('coreRecord', this.parentElement.closest('.core-cloned-prods'), 0)));
        addItemToCart(itemRecord);
    }

    function filterOptions() {
        const input    = document.getElementById("searchInput").value.toUpperCase();
        const dropdown = document.getElementById("dropdownOptions");
        const items    = dropdown.querySelectorAll(".search-dropdown-item");

        // Show the dropdown if input has value
        dropdown.classList.toggle("d-none", !input);

        items.forEach(item => {
            const text = item.textContent || item.innerText;
            item.style.display = text.toUpperCase().includes(input) ? "" : "none";
        });
    }

    const removeItemFromCart = (itemRecord) => {
        const cart = core.cr.getData('cart');
        // Check cart for item
        const cartItems = [];
        for (const item of cart) {
            if(item.sku !== itemRecord.sku){
                cartItems.push(item);
            }
        }

        // Store the cart
        core.cr.setData('cart', cartItems);

        // Refresh the cart UX
        refreshCart();
    }

    const addItemToCart = (itemRecord) => {
        const cart = core.cr.getData('cart');
        // Check cart for item
        let itemInCart = false;
        for (const item of cart) {
            if(item.sku === itemRecord.sku){
                itemInCart = true;
                if(itemRecord.hasOwnProperty('quantity')){
                    item.quantity = itemRecord.quantity;
                }else{
                    item.quantity = item.quantity + 1;
                }
                item.total = item.quantity * +item.price;
            }
        }

        // Add new item
        if(!itemInCart){
            itemRecord.quantity = itemRecord.quantity || 1;
            itemRecord.total    = itemRecord.quantity * +itemRecord.price;
            cart.push(itemRecord);
        }

        // Store the cart
        core.cr.setData('cart', cart);

        // Refresh the cart UX
        refreshCart();
    }

    const refreshProds = () => {
        const pocket = document.getElementById('prod-list');
        pocket.classList.remove('core-pocketed');
        pocket.classList.add('core-pocket');
        pocket.innerHTML = "";
    }

    const refreshCart = () => {
        const pocket = document.getElementById('cart-list');
        pocket.classList.remove('core-pocketed');
        pocket.classList.add('core-pocket');
        pocket.innerHTML = "";

        // Total the cart
        const cart = core.cr.getData('cart');
        let cartTotal = 0;
        for (const item of cart) {
            cartTotal+= +item.total;
        }

        // Calculate & Store the totals
        const totals = core.cr.getData('totals');
        totals.subtotal = cartTotal;
        totals.taxable  = (totals.discount * -1) + totals.subtotal;
        totals.taxes    = totals.taxable * core.cr.getData('taxes').decimal;
        totals.total    = totals.taxable + totals.taxes;
        core.cr.setData('totals',totals);

        core.pk.init();
    }

    function increaseQuantity(button) {
        const input = button.parentElement.querySelector('.quantity-input');
        input.value = parseInt(input.value) + 1;
        const itemRecord = JSON.parse(JSON.stringify(core.cr.getData('coreRecord', input.parentElement.closest('.core-cloned-cart'), 0)));
        itemRecord.quantity = +input.value;
        addItemToCart(itemRecord);
    }

    function decreaseQuantity(button) {
        const input = button.parentElement.querySelector('.quantity-input');
        if (parseInt(input.value) > 1) {
            input.value = parseInt(input.value) - 1;
        }
        const itemRecord = JSON.parse(JSON.stringify(core.cr.getData('coreRecord', input.parentElement.closest('.core-cloned-cart'), 0)));
        itemRecord.quantity = +input.value;
        addItemToCart(itemRecord);
    }

</script>
</body>
</html>
